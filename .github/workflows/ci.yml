name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CYTASK_TEST_BROWSER: chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore server
        run: dotnet restore CyTask.slnx --locked-mode

      - name: Test server
        run: dotnet test CyTask.slnx --configuration Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            .CyDocBuild/package-lock.json
            plugins/cyannota/web/package-lock.json
            plugins/cymd/web/package-lock.json
            apps/client/package-lock.json
            apps/server/tests/postgres-smoke/package-lock.json

      - name: Install PostgreSQL test dependencies
        working-directory: apps/server/tests/postgres-smoke
        # Exercise SQL through Npgsql without requiring a shared database.
        run: npm ci --no-fund --no-audit

      - name: Check PostgreSQL queries
        working-directory: apps/server/tests/postgres-smoke
        env:
          CYTASK_TEST_CONFIGURATION: Release
        run: npm test

      - name: Check encrypted PostgreSQL content
        working-directory: apps/server/tests/postgres-smoke
        env:
          CYTASK_TEST_CONFIGURATION: Release
          CYTASK_TEST_ENCRYPTION: "1"
        run: node run.mjs

      - name: Check offline storage conversion
        working-directory: apps/server/tests/postgres-smoke
        run: node encryption-migration.mjs

      - name: Check desktop encryption key handling
        run: node --test apps/client/tests/encryption.test.cjs

      - name: Check MCP server
        run: node --test integrations/mcp/test/*.test.mjs

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci --no-fund --no-audit

      - name: Build Web client
        working-directory: apps/web
        run: npm run build

      - name: Check native documentation links
        run: node --test apps/client/tests/help.test.cjs

      - name: Audit production Web dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

      - name: Install browser for Web tests
        working-directory: apps/web
        # Ubuntu permits the packaged Chrome sandbox; downloaded headless-shell
        # binaries cannot create user namespaces on the hosted runner.
        run: npx playwright install --with-deps chrome

      - name: Test live calls with synthetic devices
        working-directory: apps/web
        run: npm run test:calls

      - name: Test theme readability
        working-directory: apps/web
        run: npm run test:appearance

      - name: Test bilingual offline user guide
        working-directory: apps/web
        run: npm run test:help

      - name: Test guide delivery and workspace entry
        working-directory: apps/web
        run: npm run test:help-server

      - name: Test two-factor sign-in
        working-directory: apps/web
        run: npm run test:mfa

      - name: Test encrypted workspace selector
        working-directory: apps/web
        run: node tests/encryption-selector.mjs

      - name: Audit Markdown editor dependencies
        working-directory: plugins/cymd/web
        run: npm audit --audit-level=high

      - name: Install CyAnnota plugin dependencies
        working-directory: plugins/cyannota/web
        run: npm ci --no-fund --no-audit

      - name: Build CyAnnota plugin
        working-directory: plugins/cyannota/web
        run: npm run build

      - name: Audit CyAnnota dependencies
        working-directory: plugins/cyannota/web
        run: npm audit --audit-level=high

      - name: Install desktop dependencies
        working-directory: apps/client
        run: npm ci --no-fund --no-audit

      - name: Check desktop client
        working-directory: apps/client
        run: npm run check

      - name: Audit desktop dependencies
        working-directory: apps/client
        run: npm audit --audit-level=high

      - name: Build production image
        run: docker build --file infra/docker/Dockerfile .
